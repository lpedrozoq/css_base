<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2.2 grid - general</title>
    <style>
      .container-basic {
        display: grid;
        width: 400px;
        height: 400px;
        background-color: papayawhip;
        /*fr: fraction*/
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr 1fr;
      }
      .item-basic {
        background-color: purple;
      }

      .container-basic .item-basic:nth-child(1) {
        grid-column: 1/2;
      }

      .container-basic .item-basic:nth-child(2) {
        grid-column: 2/3;
        grid-row: 2/3;
      }

      .container-basic .item-basic:nth-child(3) {
        grid-column: 3/4;
        grid-row: 3/4;
      }

      .container-basic .item-basic:nth-child(4) {
        grid-column: 4/5;
        grid-row: 4/5;
      }
    </style>
  </head>
  <body>
    <div class="container-basic">
      <div class="item-basic"></div>
      <div class="item-basic"></div>
      <div class="item-basic"></div>
      <div class="item-basic"></div>
    </div>
  </body>
</html>
