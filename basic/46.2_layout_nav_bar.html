<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>46.2 - layout - navbar</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      /* Style the header */
      div.div-header {
        background-color: #f1f1f1;
        padding: 20px;
        text-align: center;
      }
      /* The navbar container */
      div.div-topnav {
        overflow: hidden;
        background-color: #333;
      }
      /* Style the topnav links */
      div.div-topnav a {
        float: left;
        display: block;
        color: #f2f2f2;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
      }
      /* Change color on hover */
      div.div-topnav a:hover {
        background-color: #ddd;
        color: black;
      }
    </style>
  </head>
  <body>
    <div class="div-header">
      <h1>Header</h1>
    </div>

    <div class="div-topnav">
      <a href="#">Link</a>
      <a href="#">Link</a>
      <a href="#">Link</a>
    </div>
  </body>
</html>
